services:
  - type: web
    name: ai-resume-analyzer-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AI_PROVIDER
        value: demo
      - key: AI_MODEL
        value: gemini-1.5-flash
      - key: FILE_RETENTION_POLICY
        value: memory
